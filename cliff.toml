# git-cliff configuration for flint-ai-datasource.
# Documentation: https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope | upper_first }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}\
{% endfor %}\n"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = ".*!:", group = "Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests and CI" },
  { message = "^ci", group = "Tests and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Maintenance" },
  { message = "^refactor", group = "Maintenance" },
  { message = "^style", group = "Maintenance" },
  { body = ".*", group = "Changes" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
