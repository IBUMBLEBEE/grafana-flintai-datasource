apiVersion: 1

datasources:
  - name: Flint AI - Demo
    type: ibumblebee-flint-ai-datasource
    uid: flint-ai-demo
    # UI saves advance the stored version, so this seed no longer overwrites them on restart.
    version: 1
    access: proxy
    editable: true
    jsonData:
      baseUrl: https://api.openai.com/v1
      model: gpt-5
      providerKind: openai-compatible
    secureJsonData:
      apiKey: $FLINT_AI_API_KEY
  - name: Flint AI - Secondary
    type: ibumblebee-flint-ai-datasource
    uid: flint-ai-secondary
    # UI saves advance the stored version, so this seed no longer overwrites them on restart.
    version: 1
    access: proxy
    editable: true
    jsonData:
      baseUrl: https://gateway.example.test/v1
      model: flint-model-secondary
      providerKind: openai-compatible
    secureJsonData:
      apiKey: $FLINT_AI_API_KEY_SECONDARY
